<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#0a0d17"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="60%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4"/>

  <!-- Minecraft Voxel Grid Pattern Overlay -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="2">
    <line x1="64" y1="0" x2="64" y2="512"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="192" y1="0" x2="192" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="448" y1="0" x2="448" y2="512"/>
    <line x1="0" y1="64" x2="512" y2="64"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/>
  </g>

  <!-- Subtle Radial Backlight Glow -->
  <circle cx="256" cy="256" r="140" fill="#06b6d4" opacity="0.18" filter="url(#glow)"/>

  <!-- Iconic Minecraft Diamond Sword Diagonal Silhouette -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#glow)">
    <!-- Sword Blade (stepped pixelated tip) -->
    <path d="M 244 80 L 268 80 L 280 92 L 280 280 L 268 280 L 268 300 L 244 300 L 244 280 L 232 280 L 232 92 Z" fill="url(#bladeGrad)" stroke="#0e7490" stroke-width="4"/>
    <!-- Blade core streak -->
    <line x1="256" y1="96" x2="256" y2="275" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Crossguard -->
    <rect x="200" y="300" width="112" height="24" rx="4" fill="#0284c7" stroke="#0e7490" stroke-width="3"/>
    <rect x="216" y="292" width="80" height="8" rx="2" fill="#38bdf8"/>
    
    <!-- Handle -->
    <rect x="246" y="324" width="20" height="64" rx="2" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    
    <!-- Pommel -->
    <rect x="238" y="388" width="36" height="24" rx="4" fill="#0284c7" stroke="#0e7490" stroke-width="3"/>
    <rect x="246" y="394" width="20" height="12" rx="2" fill="#67e8f9"/>
  </g>

  <!-- Stylized "S" Emblem for Softly Client at Bottom Center -->
  <g transform="translate(256, 380)">
    <rect x="-80" y="-22" width="160" height="44" rx="22" fill="#0c121e" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glow)"/>
    <text x="0" y="7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="22" fill="#38bdf8" text-anchor="middle" letter-spacing="4">SOFTLY</text>
  </g>
</svg>
